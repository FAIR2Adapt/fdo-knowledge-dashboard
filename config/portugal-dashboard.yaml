# Site texts, the members, how they are read and how the facets are presented; every member fact comes through fdo-consume.
site:
  title: "Portugal Adaptation Knowledge Dashboard"
  brand:
    lines: ["Portugal Adaptation", "Knowledge Dashboard"]
    logo: {image: assets/icons/brand-symbol.png, alt: ""}
  case_study: "CS4"                                  # the FAIR2Adapt case study this deployment belongs to; metadata, not the site's name
  hero:
    heading: "Your guide to climate adaptation in Portugal"
    highlight: "Portugal"                            # the word of the heading shown in green
    lead: "Explore climate adaptation knowledge: policy documents, datasets and scientific claims, as their records state them."
  qa:                                                # question answering: a preview layout only, no service is connected
    preview: true                                    # false turns the home bar into a plain search
    preview_notice: "Question answering is under development and will be integrated later."
  discovery:                                         # external discovery (NKUA, T4.4); not connected
    mode: disabled
    label: "NKUA graph discovery"
    note: "The NKUA graph discovery service is not connected yet; when it is, its results will be shown here, apart from this dashboard's resources."
  categories:                                        # count cards over the stated resource types; none stated counts 0
    - {label: "Scientific Articles", types: ["scientific article", "journal article", "scholarly article"], icon: assets/icons/resource-articles.png, tone: orange}
    - {label: "Policy Documents", types: ["policy document"], icon: assets/icons/resource-policy.png, tone: green}
    - {label: "Datasets", types: ["dataset"], icon: assets/icons/resource-datasets.png, tone: blue}
    - {label: "Web Platforms", types: ["web platform", "web application", "software application"], icon: assets/icons/resource-web.png, tone: purple}
    - {label: "Reports", types: ["report"], icon: assets/icons/resource-reports.png, tone: green}
  theme: {primary: "#286d32", deep: "#0b4930", sage: "#eff4eb"}                     # the dashboard's green; the software's default is grey and dark blue
  background: {image: assets/portugal-landscape.png, alt: "Watercolor landscape of a Portuguese river valley"}
  footer:
    trust:                                           # three short statements; keep them true for this deployment
      - {icon: assets/icons/trust-shield.png, title: "Knowledge from Records", text: "Every value is what a record states"}
      - {icon: assets/icons/trust-hands.png, title: "FAIR by Design", text: "Findable, accessible, interoperable, reusable"}
      - {icon: assets/icons/trust-refresh.png, title: "Snapshot-based", text: "Built {date} from the snapshot of {taken}"}
    partners:
      - {name: "CE3C", logo: assets/icons/partner-ce3c.png}
      - {name: "FAIR2Adapt", logo: assets/icons/partner-fair2adapt.png}
      - {name: "Adaptation Hubs", logo: assets/icons/partner-adaptation-hubs.png}
    partners_confirmed: true
  source_notice: "Prototype under development based on CS4 designed pages: metadata of selected research objects from ROHub."
  pages:
    how: {enabled: false}
  about: |
    This site lists the FAIR Digital Objects of one collection and shows a page for each: what it is, who made it,
    the claims and statements it carries, its data products and files, and under which conditions it may be used.
source:
  kind: pids                                         # the publication FDOs provided by the case study (CS4)
  data_origin: real                                # real | synthetic | experimental; stated in every build output
  pids:
    - https://w3id.org/ro-id/c594948e-cf4f-44ce-b96e-097e6ba5cd8e
    - https://w3id.org/ro-id/10f2756e-a221-4754-8b90-d088ab4409e5
    - https://w3id.org/ro-id/1bffc87b-d080-41ec-96b5-5f46ecbd76db
  crate_url: "https://api.rohub.org/api/ros/{uuid}/crate/download/"   # ROHub's RO-Crate export; used by scripts/snapshot.py and build_site.py --refresh
  recorded: "snapshots/cs4-papers"                   # the snapshot read at build time; --refresh records it again from crate_url
reading:
  contracts: {collection: listing-collection-v1, record: listing-record-v1, claims: listing-claims-v1}   # config/contracts/
  profile_overlay: cca-dashboard-additions           # Dashboard profile v1.0.0 additions read on top of the CCA map, config/maps/
  fallback_map: rohub-bibliography-ro                     # map for objects that declare no profile (ROHub exports)
  max_members: 5000                                  # members read from one collection; the rest are counted, not shown
  map_notes:                                         # one sentence per map, shown under "Technical details" of each record read through it
    rohub-bibliography-ro: "The root's datePublished and author are the ROHub registration time and the depositing account; this site does not read them."
  profile_labels:
    "https://w3id.org/cca-crate-profile/0.9": "CCA-Crate profile 0.9"
    "https://w3id.org/cc-crate-profile/0.9": "CCA-Crate profile 0.9"
facets:                                              # presentation: which record field a facet reads, in which order, under which label
  - {id: type, label: "Resource type", concept: resource_type, icon: "▤", panel: main, description: "As the records state it (additionalType); a record that states none is listed as 'type not stated'"}
  - {id: topic, label: "Topics", concept: keywords, icon: assets/icons/topic-globe.png, home: true, description: "Keywords as the records state them"}   # home: a topic card on the home page
  - {id: year, label: "Year", concept: year, icon: "◷", description: "Year of the date the record states, where this site reads one"}
  - {id: profile, label: "Profile", concept: profile, group: technical, description: "The metadata profile each record declares"}
# Profile attribute TBD: hazard, sector and place facets; no profile term gives them, keywords are free text
facets_without_source:
  - {label: "Climate hazards", icon: assets/icons/topic-hazards.png, why: "Hazard vocabulary not available yet"}
  - {label: "Adaptation sector", icon: assets/icons/topic-sector.png, why: "Sector vocabulary not available yet"}
  - {label: "Geographical scope", icon: assets/icons/topic-scope.png, why: "Geographical scope not available yet"}
diagnostics_open: false                              # technical details collapsed by default
